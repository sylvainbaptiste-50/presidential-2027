name: presidential_2027
description: Application de consultation des programmes présidentiels 2027
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0

# Ajout du générateur d'icônes
dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#000000" # Fond noir pour correspondre au logo
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/index_candidats.json
    - assets/programmes/
    - assets/logo.png